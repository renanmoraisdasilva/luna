<body class="bg-background text-on-background font-body-md text-body-md min-h-screen flex flex-col pt-4xl">
<!-- TopNavBar -->
<header class="bg-[#fbf9fa] fixed top-0 w-full z-50 border-b border-[#e5e7eb] h-4xl flex justify-center shadow-[0_1px_3px_0_rgba(0,0,0,0.05)]">
<div class="w-full flex justify-between items-center px-lg md:px-xl h-full max-w-[1280px] mx-auto relative">
<!-- Brand -->
<a class="font-display text-display font-bold text-primary" href="../catalog/shop.html">Luna</a>
<!-- Navigation Links (Desktop) -->
<nav class="hidden md:flex gap-2xl h-full items-center absolute left-1/2 -translate-x-1/2">
<a class="text-[#6b7280] hover:text-[#253347] transition-colors duration-200 h-full flex items-center" href="../catalog/shop.html">Shop</a>
<a class="text-[#6b7280] hover:text-[#253347] transition-colors duration-200 h-full flex items-center" href="../orders/order-list.html">Orders</a>
<a class="text-on-background font-bold border-b-2 border-on-background h-full flex items-center pt-xs" href="../account/account.html">Account</a>
</nav>
<!-- Trailing Icons -->
<div class="flex items-center">
<button class="p-xs rounded-button hover:bg-surface-container-low transition-colors duration-200 flex items-center justify-center text-primary cursor-pointer active:opacity-80 relative" onclick="window.location.href='../cart/cart.html'">
<span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
</button>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-[1280px] mx-auto px-lg md:px-xl py-3xl">
<div class="w-full max-w-[720px] mx-auto">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background mb-xl">Account</h1>
<!-- Profile Card -->
<section class="bg-surface-card border border-border-standard rounded-lg shadow-[0_2px_4px_rgba(0,0,0,0.02)] p-xl mb-xl">
<h2 class="font-product-title text-product-title text-on-surface mb-lg pb-md border-b border-border-standard">Profile</h2>
<form class="space-y-lg">
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-sm" for="firstName">First name</label>
<input class="w-full h-control border border-border-standard rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all px-md py-sm font-body-md text-body-md text-on-surface bg-surface-card" id="firstName" type="text" value="Jane"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-sm" for="lastName">Last name</label>
<input class="w-full h-control border border-border-standard rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all px-md py-sm font-body-md text-body-md text-on-surface bg-surface-card" id="lastName" type="text" value="Doe"/>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-sm" for="email">Email</label>
<input class="w-full h-control border border-border-standard rounded-lg px-md py-sm font-body-md text-body-md text-on-surface-variant bg-surface-container-low cursor-not-allowed" id="email" readonly="" type="email" value="jane.doe@example.com"/>
</div>
<div class="pt-md">
<button class="h-control px-lg py-sm rounded-button bg-primary text-on-primary font-label-caps text-label-caps hover:bg-primary-container transition-colors active:scale-[0.98] uppercase" type="submit">
                            Save changes
                        </button>
</div>
</form>
</section>
<!-- Security Card -->
<section class="bg-surface-card border border-border-standard rounded-lg shadow-[0_2px_4px_rgba(0,0,0,0.02)] p-xl">
<h2 class="font-product-title text-product-title text-on-surface mb-lg pb-md border-b border-border-standard">Security</h2>
<div class="space-y-xl">
<div class="flex flex-col md:flex-row md:items-center justify-between gap-lg pb-xl border-b border-border-subtle">
<p class="font-body-md text-body-md text-on-surface-variant max-w-md">Update your password to keep your account secure.</p>
<button class="h-control px-lg py-sm rounded-button bg-surface-card text-on-surface border border-border-standard font-label-caps text-label-caps hover:bg-surface-container-high transition-colors whitespace-nowrap">
                            Change password
                        </button>
</div>
<div class="flex flex-col md:flex-row md:items-center justify-between gap-lg">
<p class="font-body-md text-body-md text-on-surface-variant">Sign out of your account on this device.</p>
<button class="h-control px-lg py-sm rounded-button bg-surface-card text-status-error border border-status-error/30 font-label-caps text-label-caps hover:bg-error-container transition-colors whitespace-nowrap">
                            Logout
                        </button>
</div>
</div>
</section>
</div>
</main>

<footer class="bg-surface-container-low border-t border-border-standard w-full">
<div class="w-full py-2xl px-lg md:px-xl flex flex-col md:flex-row justify-between items-center gap-lg max-w-[1280px] mx-auto">

<a class="text-secondary hover:text-primary transition-colors duration-200 cursor-pointer" href="#">Contact Us</a>
<a class="text-secondary hover:text-primary transition-colors duration-200 cursor-pointer" href="#">Return Policy</a>
</nav>
</div>
</footer>
