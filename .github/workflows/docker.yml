name: Luna Docker Publish

on:
  workflow_run:
    workflows: [ "Luna CI" ]
    branches: [ main ]
    types: [ completed ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Luna images to GHCR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: infrastructure/frontend.Dockerfile
            context: .
            image: ghcr.io/${{ github.repository_owner }}/luna-frontend
            args: |
              IDENTITY_API_INTERNAL_URL=http://identity:8080
              CATALOG_API_INTERNAL_URL=http://catalog:8080
              ORDERS_API_INTERNAL_URL=http://orders:8080
              PAYMENTS_API_INTERNAL_URL=http://payments:8080
              INVENTORY_API_INTERNAL_URL=http://inventory:8080
              SHIPPING_API_INTERNAL_URL=http://shipping:8080
              NEXT_PUBLIC_SIGNOZ_URL=${{ vars.SIGNOZ_URL }}
          - name: identity
            dockerfile: infrastructure/service.Dockerfile
            context: .
            image: ghcr.io/${{ github.repository_owner }}/luna-identity
            args: |
              PROJECT=src/Services/Identity/Identity.csproj
          - name: catalog
            dockerfile: infrastructure/service.Dockerfile
            context: .
            image: ghcr.io/${{ github.repository_owner }}/luna-catalog
            args: |
              PROJECT=src/Services/Catalog/Catalog.Api/Catalog.Api.csproj
          - name: orders
            dockerfile: infrastructure/service.Dockerfile
            context: .
            image: ghcr.io/${{ github.repository_owner }}/luna-orders
            args: |
              PROJECT=src/Services/Orders/Orders.Api/Orders.Api.csproj
          - name: payments
            dockerfile: infrastructure/service.Dockerfile
            context: .
            image: ghcr.io/${{ github.repository_owner }}/luna-payments
            args: |
              PROJECT=src/Services/Payments/Payments.Api/Payments.Api.csproj
          - name: inventory
            dockerfile: infrastructure/service.Dockerfile
            context: .
            image: ghcr.io/${{ github.repository_owner }}/luna-inventory
            args: |
              PROJECT=src/Services/Inventory/Inventory.Api/Inventory.Api.csproj
          - name: shipping
            dockerfile: infrastructure/service.Dockerfile
            context: .
            image: ghcr.io/${{ github.repository_owner }}/luna-shipping
            args: |
              PROJECT=src/Services/Shipping/Shipping.Api/Shipping.Api.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.args }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          tags: |
            ${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
            ${{ matrix.image }}:latest
