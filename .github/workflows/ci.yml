name: Luna CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore Luna.sln

      - name: Build solution
        run: dotnet build Luna.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test tests/Unit/Luna.UnitTests.csproj
          --configuration Release
          --nologo
          --collect:"XPlat Code Coverage"
          --settings tests/coverage.runsettings
          --results-directory TestResults/Unit

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: TestResults/Unit/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Run integration tests
        run: dotnet test tests/Integration/Luna.IntegrationTests.csproj --configuration Release --nologo

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/Frontend
        run: npm ci

      - name: Lint frontend
        working-directory: src/Frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: src/Frontend
        run: npm test

      - name: Build frontend
        working-directory: src/Frontend
        run: npm run build

  compose:
    name: Docker Compose smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start compose stack
        run: docker compose -f infrastructure/docker-compose.yml up -d --build

      - name: Wait for services
        run: sleep 20

      - name: Check frontend and health endpoints
        run: |
          curl -fsS http://localhost:3000/swagger
          for svc in identity catalog orders payments inventory shipping; do
            curl -fsS "http://localhost:3000/api/services/$svc/health"
          done

      - name: Tear down compose stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml down -v
