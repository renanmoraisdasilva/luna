version: 2

updates:
  # .NET 10 solution: roughly 20 direct packages plus their transitive closure. Nothing in the repository
  # flags a CVE today, so this is the only mechanism that will surface one.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Five pending pull requests is reviewable. Ten is a backlog nobody reads, which defeats the point.
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates across the .NET stack arrive together and are safe to review as one set.
      dotnet-dependencies:
        update-types:
          - minor
          - patch
    ignore:
      # A future .NET major move is a migration project, not a dependency bump. Every project must be
      # retargeted, the published runtime image must change with it (the newer aspnet image contains only
      # the newer runtime, so it cannot start an older-targeted application), and EF Core may generate
      # different migrations. Handle it deliberately rather than as weekly noise.
      - dependency-name: "Microsoft.*"
        update-types:
          - version-update:semver-major
      # FluentAssertions 8 changed to a commercial licence for commercial use. That is a purchasing decision,
      # not a technical one, so it is not surfaced automatically.
      - dependency-name: "FluentAssertions"
        update-types:
          - version-update:semver-major
      # Every other major on this side too. Naming individual packages was not enough, because the ones that
      # slip through are exactly the ones nobody anticipated. Majors are migrations: they can change runtime
      # targets, licensing, and public APIs in ways a grouped pull request cannot express. Minors and patches
      # still arrive, grouped, because those have been safe throughout.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - backend

  # The frontend pins exact-ish versions of about 20 packages. Grouping keeps the PR count reviewable
  # while still surfacing major upgrades individually.
  - package-ecosystem: npm
    directory: /src/Frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-patch-updates:
        update-types:
          - patch
    ignore:
      # The gateway image and the local Node toolchain are both pinned to Node 22. Moving the base image
      # across four majors is a deliberate platform change.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - frontend

  # service.Dockerfile pins the .NET SDK and ASP.NET runtime base images by digest. This is what turns
  # those pins from "frozen forever" into "changed deliberately".
  - package-ecosystem: docker
    directory: /infrastructure
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The service image is pinned to the .NET 10 SDK and ASP.NET 10 runtime. The service Dockerfile builds
      # and runs net10.0 assemblies, and a newer image carries only the newer runtime, so bumping the tag
      # without retargeting the solution produces an image that cannot start. The frontend image moves to a
      # new Node major only when the local toolchain moves with it.
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "node"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - backend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
