services:
  init-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: luna-signoz-init-clickhouse
    networks: [luna]
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    restart: on-failure
    volumes:
      - ./observability/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts

  zookeeper:
    image: signoz/zookeeper:3.7.1
    container_name: luna-signoz-zookeeper
    user: root
    networks: [luna]
    environment:
      ZOO_SERVER_ID: "1"
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_AUTOPURGE_INTERVAL: "1"
      ZOO_ENABLE_PROMETHEUS_METRICS: "yes"
      ZOO_PROMETHEUS_METRICS_PORT_NUMBER: "9141"
    volumes:
      - luna-signoz-zookeeper:/bitnami/zookeeper
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null"]
      interval: 30s
      timeout: 5s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: luna-signoz-clickhouse
    networks: [luna]
    depends_on:
      init-clickhouse:
        condition: service_completed_successfully
      zookeeper:
        condition: service_healthy
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ./observability/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./observability/clickhouse/custom-function.xml:/etc/clickhouse-server/config.d/custom-function.xml:ro
      - ./observability/clickhouse/users.xml:/etc/clickhouse-server/users.d/luna.xml:ro
      - ./observability/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts
      - luna-signoz-clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144

  signoz-migrator:
    image: signoz/signoz-otel-collector:v0.144.5
    container_name: luna-signoz-migrator
    networks: [luna]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    restart: on-failure

  signoz:
    image: signoz/signoz:v0.142.1
    container_name: luna-signoz
    networks: [luna]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      SIGNOZ_ALERTMANAGER_PROVIDER: signoz
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      SIGNOZ_TOKENIZER_JWT_SECRET: local-development-only
    ports:
      - "8080:8080"
    volumes:
      - luna-signoz-sqlite:/var/lib/signoz
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  otel-collector:
    image: signoz/signoz-otel-collector:v0.144.5
    container_name: luna-signoz-otel-collector
    networks: [luna]
    pid: host
    depends_on:
      clickhouse:
        condition: service_healthy
      signoz:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - >-
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml
        --manager-config=/etc/manager-config.yaml
        --copy-path=/var/tmp/collector-config.yaml
    volumes:
      - /:/hostfs:ro
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./observability/otel-collector-opamp-config.yaml:/etc/manager-config.yaml:ro
    environment:
      OTEL_RESOURCE_ATTRIBUTES: os.type=linux
      LOW_CARDINAL_EXCEPTION_GROUPING: "false"
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  luna-signoz-clickhouse:
  luna-signoz-sqlite:
  luna-signoz-zookeeper:

networks:
  luna:
    driver: bridge
