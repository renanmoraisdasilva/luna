x-service-healthcheck: &service-healthcheck
  test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
  interval: 15s
  timeout: 3s
  retries: 24
  start_period: 10s

x-telemetry-environment: &telemetry-environment
  Telemetry__Enabled: "${TELEMETRY_ENABLED:-true}"
  Telemetry__Environment: "${TELEMETRY_ENVIRONMENT:-Development}"
  Telemetry__OtlpEndpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}"

x-telemetry-hosts: &telemetry-hosts
  - "host.docker.internal:host-gateway"

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_COLLATION: "SQL_Latin1_General_CP1_CI_AS"
    ports:
      - "1433:1433"
    volumes:
      - luna-sqlserver:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -b
          -Q "IF EXISTS (SELECT 1 FROM sys.databases WHERE name IN
          ('IdentityDb','CatalogDb','OrdersDb','PaymentsDb','InventoryDb','ShippingDb')
          AND state_desc <> 'ONLINE') THROW 50000, 'Application database is not online', 1;
          SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  floci:
    image: floci/floci:2.1.0-compat
    environment:
      FLOCI_HOSTNAME: floci
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "aws --endpoint-url http://localhost:4566 sqs list-queues > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/frontend.Dockerfile
      args:
        IDENTITY_API_INTERNAL_URL: http://identity:8080
        CATALOG_API_INTERNAL_URL: http://catalog:8080
        ORDERS_API_INTERNAL_URL: http://orders:8080
        PAYMENTS_API_INTERNAL_URL: http://payments:8080
        INVENTORY_API_INTERNAL_URL: http://inventory:8080
        SHIPPING_API_INTERNAL_URL: http://shipping:8080
    ports: ["3000:3000"]
    environment:
      <<: *telemetry-environment
      CATALOG_API_INTERNAL_URL: http://catalog:8080
      IDENTITY_API_INTERNAL_URL: http://identity:8080
      ORDERS_API_INTERNAL_URL: http://orders:8080
      PAYMENTS_API_INTERNAL_URL: http://payments:8080
      INVENTORY_API_INTERNAL_URL: http://inventory:8080
      SHIPPING_API_INTERNAL_URL: http://shipping:8080
      LUNA_COOKIE_ENCRYPTION_KEY: "${LUNA_COOKIE_ENCRYPTION_KEY}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE}"
      # The API explorer is available locally and disabled in production by default.
      ENABLE_API_EXPLORER: "true"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME_FRONTEND:-luna-frontend}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_HTTP_ENDPOINT:-http://host.docker.internal:4318}"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${TELEMETRY_ENVIRONMENT:-Development}"
      HOSTNAME: 0.0.0.0
    extra_hosts: *telemetry-hosts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 24
      start_period: 10s

  identity:
    build:
      context: ..
      dockerfile: infrastructure/service.Dockerfile
      args: { PROJECT: src/Services/Identity/Identity.csproj }
    command: ["Identity.dll"]
    environment:
      <<: *telemetry-environment
      ConnectionStrings__Database: "Server=sqlserver;Database=IdentityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      OpenIddict__Issuer: http://identity:8080/
      ServiceAuthentication__Clients__Orders__Secret: "${ORDERS_SERVICE_CLIENT_SECRET:?Set ORDERS_SERVICE_CLIENT_SECRET in .env}"
    extra_hosts: *telemetry-hosts
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck: *service-healthcheck

  catalog:
    build:
      context: ..
      dockerfile: infrastructure/service.Dockerfile
      args: { PROJECT: src/Services/Catalog/Catalog.Api/Catalog.Api.csproj }
    command: ["Catalog.Api.dll"]
    environment:
      <<: *telemetry-environment
      ConnectionStrings__Database: "Server=sqlserver;Database=CatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      OpenIddict__Issuer: http://identity:8080/
    extra_hosts: *telemetry-hosts
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck: *service-healthcheck

  orders:
    build:
      context: ..
      dockerfile: infrastructure/service.Dockerfile
      args: { PROJECT: src/Services/Orders/Orders.Api/Orders.Api.csproj }
    command: ["Orders.Api.dll"]
    environment:
      <<: *telemetry-environment
      ConnectionStrings__Database: "Server=sqlserver;Database=OrdersDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      OpenIddict__Issuer: http://identity:8080/
      ServiceAuthentication__ClientId: orders
      ServiceAuthentication__ClientSecret: "${ORDERS_SERVICE_CLIENT_SECRET:?Set ORDERS_SERVICE_CLIENT_SECRET in .env}"
      ServiceAuthentication__TokenEndpoint: http://identity:8080/api/v1/identity/connect/token
      CatalogApi: http://catalog:8080/
      ShippingApi: http://shipping:8080/
      InventoryApi: http://inventory:8080/
      PaymentsApi: http://payments:8080/
    extra_hosts: *telemetry-hosts
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck: *service-healthcheck

  payments:
    build:
      context: ..
      dockerfile: infrastructure/service.Dockerfile
      args: { PROJECT: src/Services/Payments/Payments.Api/Payments.Api.csproj }
    command: ["Payments.Api.dll"]
    environment:
      <<: *telemetry-environment
      ConnectionStrings__Database: "Server=sqlserver;Database=PaymentsDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      OpenIddict__Issuer: http://identity:8080/
    extra_hosts: *telemetry-hosts
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck: *service-healthcheck

  inventory:
    build:
      context: ..
      dockerfile: infrastructure/service.Dockerfile
      args: { PROJECT: src/Services/Inventory/Inventory.Api/Inventory.Api.csproj }
    command: ["Inventory.Api.dll"]
    environment:
      <<: *telemetry-environment
      ConnectionStrings__Database: "Server=sqlserver;Database=InventoryDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      OpenIddict__Issuer: http://identity:8080/
    extra_hosts: *telemetry-hosts
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck: *service-healthcheck

  shipping:
    build:
      context: ..
      dockerfile: infrastructure/service.Dockerfile
      args: { PROJECT: src/Services/Shipping/Shipping.Api/Shipping.Api.csproj }
    command: ["Shipping.Api.dll"]
    environment:
      <<: *telemetry-environment
      ConnectionStrings__Database: "Server=sqlserver;Database=ShippingDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      OpenIddict__Issuer: http://identity:8080/
    extra_hosts: *telemetry-hosts
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck: *service-healthcheck

volumes:
  luna-sqlserver:
