networks:
  luna:
    driver: bridge

x-app-hardening: &app-hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  mem_limit: 512m
  cpus: "1.0"

x-telemetry-environment: &telemetry-environment
  Telemetry__Enabled: "${TELEMETRY_ENABLED:-false}"
  Telemetry__Environment: "${TELEMETRY_ENVIRONMENT:-Production}"
  Telemetry__OtlpEndpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"

services:
  sqlserver:
    image: "mcr.microsoft.com/mssql/server:${MSSQL_IMAGE_TAG:?Set MSSQL_IMAGE_TAG in .env to a tested SQL Server 2022 tag}"
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      MSSQL_COLLATION: "SQL_Latin1_General_CP1_CI_AS"
    ports:
      - "1433:1433"
    volumes:
      - luna-sqlserver:/var/opt/mssql
    networks:
      - luna
    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -b
          -Q "IF EXISTS (SELECT 1 FROM sys.databases WHERE name IN
          ('IdentityDb','CatalogDb','OrdersDb','PaymentsDb','InventoryDb','ShippingDb')
          AND state_desc <> 'ONLINE') THROW 50000, 'Application database is not online', 1;
          SELECT 1" || exit 1
      interval: 30s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    image: ghcr.io/renanmoraisdasilva/luna-frontend:${LUNA_IMAGE_TAG:?Set LUNA_IMAGE_TAG in .env}
    restart: unless-stopped
    <<: *app-hardening
    user: node
    ports:
      - "3001:3000"
    environment:
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME_FRONTEND:-luna-frontend}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_HTTP_ENDPOINT:-}"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${TELEMETRY_ENVIRONMENT:-Production}"
      HOSTNAME: 0.0.0.0
      PORT: 3000
      CATALOG_API_INTERNAL_URL: http://catalog:8080
      IDENTITY_API_INTERNAL_URL: http://identity:8080
      ORDERS_API_INTERNAL_URL: http://orders:8080
      PAYMENTS_API_INTERNAL_URL: http://payments:8080
      INVENTORY_API_INTERNAL_URL: http://inventory:8080
      SHIPPING_API_INTERNAL_URL: http://shipping:8080
      LUNA_COOKIE_ENCRYPTION_KEY: "${LUNA_COOKIE_ENCRYPTION_KEY:?Set LUNA_COOKIE_ENCRYPTION_KEY in .env}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:?Set AUTH_COOKIE_SECURE in .env}"
    networks:
      - luna
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  identity:
    image: ghcr.io/renanmoraisdasilva/luna-identity:${LUNA_IMAGE_TAG:?Set LUNA_IMAGE_TAG in .env}
    restart: unless-stopped
    <<: *app-hardening
    user: app
    environment:
      <<: *telemetry-environment
      ConnectionStrings__Database: "Server=sqlserver;Database=IdentityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      OpenIddict__Issuer: http://identity:8080/
      ServiceAuthentication__Clients__Orders__Secret: "${ORDERS_SERVICE_CLIENT_SECRET:?Set ORDERS_SERVICE_CLIENT_SECRET in .env}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - luna
    healthcheck: &service_healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  catalog:
    image: ghcr.io/renanmoraisdasilva/luna-catalog:${LUNA_IMAGE_TAG:?Set LUNA_IMAGE_TAG in .env}
    restart: unless-stopped
    <<: *app-hardening
    user: app
    environment:
      <<: *telemetry-environment
      ConnectionStrings__Database: "Server=sqlserver;Database=CatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      OpenIddict__Issuer: http://identity:8080/
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - luna
    healthcheck: *service_healthcheck

  orders:
    image: ghcr.io/renanmoraisdasilva/luna-orders:${LUNA_IMAGE_TAG:?Set LUNA_IMAGE_TAG in .env}
    restart: unless-stopped
    <<: *app-hardening
    user: app
    environment:
      <<: *telemetry-environment
      ConnectionStrings__Database: "Server=sqlserver;Database=OrdersDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      OpenIddict__Issuer: http://identity:8080/
      ServiceAuthentication__ClientId: orders
      ServiceAuthentication__ClientSecret: "${ORDERS_SERVICE_CLIENT_SECRET:?Set ORDERS_SERVICE_CLIENT_SECRET in .env}"
      ServiceAuthentication__TokenEndpoint: http://identity:8080/api/v1/identity/connect/token
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - luna
    healthcheck: *service_healthcheck

  payments:
    image: ghcr.io/renanmoraisdasilva/luna-payments:${LUNA_IMAGE_TAG:?Set LUNA_IMAGE_TAG in .env}
    restart: unless-stopped
    <<: *app-hardening
    user: app
    environment:
      <<: *telemetry-environment
      ConnectionStrings__Database: "Server=sqlserver;Database=PaymentsDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      OpenIddict__Issuer: http://identity:8080/
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - luna
    healthcheck: *service_healthcheck

  inventory:
    image: ghcr.io/renanmoraisdasilva/luna-inventory:${LUNA_IMAGE_TAG:?Set LUNA_IMAGE_TAG in .env}
    restart: unless-stopped
    <<: *app-hardening
    user: app
    environment:
      <<: *telemetry-environment
      ConnectionStrings__Database: "Server=sqlserver;Database=InventoryDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      OpenIddict__Issuer: http://identity:8080/
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - luna
    healthcheck: *service_healthcheck

  shipping:
    image: ghcr.io/renanmoraisdasilva/luna-shipping:${LUNA_IMAGE_TAG:?Set LUNA_IMAGE_TAG in .env}
    restart: unless-stopped
    <<: *app-hardening
    user: app
    environment:
      <<: *telemetry-environment
      ConnectionStrings__Database: "Server=sqlserver;Database=ShippingDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      OpenIddict__Issuer: http://identity:8080/
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - luna
    healthcheck: *service_healthcheck

volumes:
  luna-sqlserver:
