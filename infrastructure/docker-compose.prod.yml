networks:
  luna:
    name: luna_default
    driver: bridge

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_COLLATION: "SQL_Latin1_General_CP1_CI_AS"
    ports:
      - "1433:1433"
    volumes:
      - luna-sqlserver:/var/opt/mssql
    networks:
      - luna
    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -b
          -Q "IF EXISTS (SELECT 1 FROM sys.databases WHERE name IN
          ('IdentityDb','CatalogDb','OrdersDb','PaymentsDb','InventoryDb','ShippingDb')
          AND state_desc <> 'ONLINE') THROW 50000, 'Application database is not online', 1;
          SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    image: ghcr.io/renanmoraisdasilva/luna-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      CATALOG_API_INTERNAL_URL: http://catalog:8080
    networks:
      - luna
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/swagger').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  identity:
    image: ghcr.io/renanmoraisdasilva/luna-identity:latest
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: "${IDENTITY_DB_CONNECTION_STRING}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - luna
    healthcheck: &service_healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  catalog:
    image: ghcr.io/renanmoraisdasilva/luna-catalog:latest
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: "${CATALOG_DB_CONNECTION_STRING}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - luna
    healthcheck: *service_healthcheck

  orders:
    image: ghcr.io/renanmoraisdasilva/luna-orders:latest
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: "${ORDERS_DB_CONNECTION_STRING}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - luna
    healthcheck: *service_healthcheck

  payments:
    image: ghcr.io/renanmoraisdasilva/luna-payments:latest
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: "${PAYMENTS_DB_CONNECTION_STRING}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - luna
    healthcheck: *service_healthcheck

  inventory:
    image: ghcr.io/renanmoraisdasilva/luna-inventory:latest
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: "${INVENTORY_DB_CONNECTION_STRING}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - luna
    healthcheck: *service_healthcheck

  shipping:
    image: ghcr.io/renanmoraisdasilva/luna-shipping:latest
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: "${SHIPPING_DB_CONNECTION_STRING}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - luna
    healthcheck: *service_healthcheck

volumes:
  luna-sqlserver:
